<script>
  // Shared by every view: the JWT lives in sessionStorage and only travels in google.script.run bodies.
  var AppSession = (function () {
    var TOKEN_KEY = 'token';
    var currentUser = null;

    function getToken() {
      return sessionStorage.getItem(TOKEN_KEY);
    }

    function setToken(token) {
      sessionStorage.setItem(TOKEN_KEY, token);
    }

    function clear() {
      sessionStorage.removeItem(TOKEN_KEY);
      currentUser = null;
    }

    function getUser() {
      return currentUser;
    }

    function setHidden(id, hidden) {
      var node = document.getElementById(id);
      if (node) {
        node.hidden = hidden;
      }
    }

    function renderHeader(user) {
      var role = user ? user.role : null;
      var label = document.getElementById('nav-session-user');
      if (label) {
        label.textContent = user ? user.username || user.email : '';
      }
      setHidden('nav-session-user', !user);
      setHidden('nav-profile', !user);
      setHidden('nav-dashboard', !(role === 'author' || role === 'admin'));
      setHidden('nav-admin', role !== 'admin');
      setHidden('nav-signin', !!user);
      setHidden('nav-register', !!user);
      setHidden('logout', !user);
    }

    function loadUser(onUser, onMissing) {
      var token = getToken();
      if (!token) {
        currentUser = null;
        renderHeader(null);
        onMissing();
        return;
      }
      var fail = function () {
        clear();
        renderHeader(null);
        onMissing();
      };
      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.ok && result.data && result.data.email) {
            currentUser = result.data;
            renderHeader(result.data);
            onUser(result.data);
          } else {
            fail();
          }
        })
        .withFailureHandler(fail)
        .api('/api/v1/auth/me', { _method: 'GET', token: token });
    }

    // The Sign out link navigates to the login page; the token is cleared first.
    var logoutLink = document.getElementById('logout');
    if (logoutLink) {
      logoutLink.addEventListener('click', clear);
    }

    return { getToken: getToken, setToken: setToken, clear: clear, getUser: getUser, loadUser: loadUser, renderHeader: renderHeader };
  })();
</script>
