<!DOCTYPE html>
<html>
  <head>
    <?!= include('app/views/partials/head') ?>
  </head>
  <body>
    <?!= include('app/views/partials/header', { appName: appName, appUrl: appUrl }) ?>

    <main class="container">
      <article>
        <header>
          <h2>Create an account</h2>
        </header>
        <form id="register-form" novalidate>
          <label for="username">
            Username
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>
          <small id="username-error" role="alert"></small>
          <label for="email">
            Email
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <small id="email-error" role="alert"></small>
          <label for="password">
            Password
            <input id="password" name="password" type="password" autocomplete="new-password" required />
          </label>
          <small id="password-error" role="alert"></small>
          <small id="register-error" role="alert"></small>
          <button id="register-submit" type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="<?= appUrl ?>?route=/login">Sign in</a></p>
      </article>
    </main>

    <?!= include('app/views/partials/client', { appUrl: appUrl }) ?>
    <?!= include('app/views/partials/session') ?>
    <script>
      var form = document.getElementById('register-form');
      var usernameInput = document.getElementById('username');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var submit = document.getElementById('register-submit');
      var generalError = document.getElementById('register-error');
      var fieldErrors = {
        username: document.getElementById('username-error'),
        email: document.getElementById('email-error'),
        password: document.getElementById('password-error'),
      };

      function setBusy(busy) {
        submit.disabled = busy;
        submit.setAttribute('aria-busy', busy ? 'true' : 'false');
      }

      function clearErrors() {
        generalError.textContent = '';
        for (var field in fieldErrors) {
          fieldErrors[field].textContent = '';
        }
      }

      function showErrors(error) {
        var details = error && error.details;
        if (details) {
          for (var field in fieldErrors) {
            if (details[field]) {
              fieldErrors[field].textContent = String(details[field]);
            }
          }
        } else {
          generalError.textContent = (error && error.message) || 'Could not register.';
        }
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearErrors();
        setBusy(true);
        App.send('/api/v1/auth/register', 'POST', {
          username: usernameInput.value,
          email: emailInput.value,
          password: passwordInput.value,
        })
          .then(function (result) {
            AppSession.setToken(result.data.token);
            window.top.location.href = App.url('/');
          })
          .catch(function (error) {
            setBusy(false);
            showErrors(error);
          });
      });

      AppSession.loadUser(
        function () {
          window.top.location.href = App.url('/');
        },
        function () {},
      );
    </script>
  </body>
</html>
