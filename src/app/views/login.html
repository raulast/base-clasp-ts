<!DOCTYPE html>
<html>
  <head>
    <?!= include('app/views/partials/head') ?>
  </head>
  <body>
    <?!= include('app/views/partials/header', { appName: appName, appUrl: appUrl }) ?>

    <main class="container">
      <article>
        <header>
          <h2>Sign in</h2>
        </header>
        <form id="login-form" novalidate>
          <label for="email">
            Email
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <label for="password">
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <small id="login-error" role="alert"></small>
          <button id="login-submit" type="submit">Sign in</button>
        </form>
        <p>No account yet? <a href="<?= appUrl ?>?route=/register">Register</a></p>
      </article>
    </main>

    <?!= include('app/views/partials/client', { appUrl: appUrl }) ?>
    <?!= include('app/views/partials/session') ?>
    <script>
      var form = document.getElementById('login-form');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var submit = document.getElementById('login-submit');
      var errorBox = document.getElementById('login-error');

      function setBusy(busy) {
        submit.disabled = busy;
        submit.setAttribute('aria-busy', busy ? 'true' : 'false');
      }

      function showError(message) {
        errorBox.textContent = message;
        emailInput.setAttribute('aria-invalid', 'true');
        passwordInput.setAttribute('aria-invalid', 'true');
      }

      function clearError() {
        errorBox.textContent = '';
        emailInput.removeAttribute('aria-invalid');
        passwordInput.removeAttribute('aria-invalid');
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearError();
        if (!emailInput.value || !passwordInput.value) {
          showError('Enter your email and password.');
          return;
        }
        setBusy(true);
        App.send('/api/v1/auth/login', 'POST', { email: emailInput.value, password: passwordInput.value })
          .then(function (result) {
            AppSession.setToken(result.data.token);
            window.top.location.href = App.url('/');
          })
          .catch(function (error) {
            setBusy(false);
            showError((error && error.message) || 'Could not sign in.');
          });
      });

      AppSession.loadUser(
        function () {
          window.top.location.href = App.url('/');
        },
        function () {},
      );
    </script>
  </body>
</html>
