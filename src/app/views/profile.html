<!DOCTYPE html>
<html>
  <head>
    <?!= include('app/views/partials/head') ?>
  </head>
  <body>
    <?!= include('app/views/partials/header', { appName: appName, appUrl: appUrl }) ?>

    <main class="container">
      <p id="loading" aria-busy="true">Loading your profile…</p>

      <article id="profile-card" hidden>
        <header>
          <h2>Your profile</h2>
        </header>
        <table>
          <tbody>
            <tr>
              <th scope="row">Username</th>
              <td id="profile-username"></td>
            </tr>
            <tr>
              <th scope="row">Email</th>
              <td id="profile-email"></td>
            </tr>
            <tr>
              <th scope="row">Member since</th>
              <td id="profile-created"></td>
            </tr>
          </tbody>
        </table>
      </article>

      <article id="signed-out-card" hidden>
        <header>
          <h2>You are not signed in</h2>
        </header>
        <p>Your session ended or you have not signed in in this tab yet.</p>
        <a href="<?= appUrl ?>" role="button">Sign in</a>
      </article>
    </main>

    <?!= include('app/views/partials/session') ?>
    <script>
      function formatDate(value) {
        var date = new Date(Number(value));
        return isNaN(date.getTime()) ? '' : date.toLocaleString();
      }

      function showProfile(user) {
        document.getElementById('profile-username').textContent = user.username || '—';
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-created').textContent = formatDate(user.created_at);
        document.getElementById('loading').hidden = true;
        document.getElementById('profile-card').hidden = false;
      }

      function showSignedOut() {
        document.getElementById('loading').hidden = true;
        document.getElementById('signed-out-card').hidden = false;
      }

      AppSession.loadUser(showProfile, showSignedOut);
    </script>
  </body>
</html>
